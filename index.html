<!doctype html>
<html lang="ru" data-theme="system" data-blur="strong" data-ambient="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Chrome Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7v8.2a1.3 1.3 0 0 1-1.3 1.3h-4.7v-6h-5v6H4.8a1.3 1.3 0 0 1-1.3-1.3z"/></symbol>
    <symbol id="icon-bookmark" viewBox="0 0 24 24"><path d="M6.5 4.2A1.7 1.7 0 0 1 8.2 2.5h7.6a1.7 1.7 0 0 1 1.7 1.7v17.3L12 18.4l-5.5 3.1z"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3.5 6.8A1.8 1.8 0 0 1 5.3 5h4.4l2 2.1h7a1.8 1.8 0 0 1 1.8 1.8v8.3a1.8 1.8 0 0 1-1.8 1.8H5.3a1.8 1.8 0 0 1-1.8-1.8z"/></symbol>
    <symbol id="icon-mobile" viewBox="0 0 24 24"><rect x="7" y="3.5" width="10" height="17" rx="2"/><path d="M10 6.5h4M11 17.5h2"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="5.8"/><path d="m15.3 15.3 5 5"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.2 12a7.2 7.2 0 0 0-.1-1.2l2-1.5-1.8-3.2-2.3 1a7.4 7.4 0 0 0-2.1-1.2L14.5 3h-5l-.4 2.9A7.4 7.4 0 0 0 7 7.1l-2.3-1-1.8 3.2 2 1.5a7.2 7.2 0 0 0 0 2.4l-2 1.5 1.8 3.2 2.3-1a7.4 7.4 0 0 0 2.1 1.2l.4 2.9h5l.4-2.9a7.4 7.4 0 0 0 2.1-1.2l2.3 1 1.8-3.2-2-1.5c.1-.4.1-.8.1-1.2Z"/></symbol>
    <symbol id="icon-theme" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-.9-.1-1.4A7.5 7.5 0 0 1 12 3Z"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 5h5v5M10 14l9-9M19 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4"/></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></symbol>
    <symbol id="icon-clear" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
  </svg>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <div class="shell">
    <aside class="sidebar" aria-label="Навигация по закладкам">
      <label class="search search-sidebar">
        <svg class="icon search-icon" aria-hidden="true"><use href="#icon-search"></use></svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Поиск закладок…" aria-label="Поиск закладок">
        <kbd id="search-kbd" class="search-kbd" aria-hidden="true">Ctrl K</kbd>
        <button id="search-clear" type="button" class="clear hidden" aria-label="Очистить поиск"><svg class="icon" aria-hidden="true"><use href="#icon-clear"></use></svg></button>
      </label>

      <nav id="folder-tree" class="folder-tree"></nav>

      <footer class="sidebar-footer">
        <button id="settings-button" type="button" class="icon-button" aria-label="Настройки" aria-pressed="false" title="Настройки"><svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg></button>
        <button id="theme-button" type="button" class="icon-button" aria-label="Переключить тему" title="Тема: системная"><svg class="icon" aria-hidden="true"><use href="#icon-theme"></use></svg></button>
      </footer>
    </aside>

    <main class="workspace">
      <header class="workspace-header">
        <div class="heading">
          <h1 id="folder-title">Загрузка…</h1>
          <nav id="breadcrumbs" class="breadcrumbs" aria-label="Путь"></nav>
        </div>

        <div class="header-actions">
          <div class="header-status" aria-live="polite"><span id="header-mode-dot"></span><span>Обновления включены</span></div>
          <button id="manager-button" type="button" class="ghost-button"><svg class="icon" aria-hidden="true"><use href="#icon-external"></use></svg><span>Диспетчер</span></button>
        </div>
      </header>

      <section id="bookmark-panel" class="content-panel">
        <div id="bookmarks" class="bookmarks" data-columns="auto" data-size="standard" data-spacing="standard" data-radius="round"></div>
      </section>

      <section id="settings-panel" class="settings-panel hidden" aria-label="Настройки">
        <div class="settings-card">
          <div class="settings-head"><div><span class="eyebrow">Chrome Page</span><h2>Настройки</h2><p>Настрой рабочее пространство под свой способ работы.</p></div></div>

          <div class="setting-section">
            <h3>Тема</h3>
            <div class="options" data-setting="theme">
              <button data-value="system" aria-pressed="false">Система</button><button data-value="light" aria-pressed="false">Светлая</button><button data-value="dark" aria-pressed="false">Тёмная</button>
            </div>
          </div>

          <div class="setting-section">
            <h3>Сортировка</h3>
            <div class="options" data-setting="sortMode">
              <button data-value="default" aria-pressed="false">Порядок Chrome</button><button data-value="name" aria-pressed="false">По имени</button><button data-value="date" aria-pressed="false">По дате</button>
            </div>
          </div>

          <div class="setting-grid">
            <div class="setting-section"><h3>Колонки</h3><div class="options" data-setting="columns"><button data-value="auto" aria-pressed="false">Авто</button><button data-value="2" aria-pressed="false">2</button><button data-value="3" aria-pressed="false">3</button><button data-value="4" aria-pressed="false">4</button></div></div>
            <div class="setting-section"><h3>Размер</h3><div class="options" data-setting="cardSize"><button data-value="compact" aria-pressed="false">Малый</button><button data-value="standard" aria-pressed="false">Средний</button><button data-value="large" aria-pressed="false">Большой</button></div></div>
            <div class="setting-section"><h3>Отступы</h3><div class="options" data-setting="spacing"><button data-value="compact">Малые</button><button data-value="standard">Средние</button><button data-value="large">Большие</button></div></div>
            <div class="setting-section"><h3>Радиусы</h3><div class="options" data-setting="radius"><button data-value="sharp">Прямые</button><button data-value="soft">Мягкие</button><button data-value="round">Скруглённые</button></div></div>
            <div class="setting-section"><h3>Размытие</h3><div class="options" data-setting="blur"><button data-value="soft">Мягкий</button><button data-value="strong">Сильный</button></div></div>
          </div>

          <div class="setting-section"><h3>Стекло</h3>
            <label class="toggle-row"><span><strong>Фоновое свечение</strong><small>Мягкие цветные сферы под стеклом</small></span><input id="ambient-toggle" type="checkbox"></label>
            <label class="range-row"><span>Прозрачность поверхности</span><input id="opacity" type="range" min="55" max="100" step="5"><output id="opacity-value">78%</output></label>
            <label class="color-row"><span>Цвет фона</span><input id="background-color" type="color"><button id="reset-background" type="button">Сбросить</button></label>
          </div>

          <div class="setting-section"><h3>Поведение</h3>
            <label class="toggle-row"><span><strong>Открывать ссылки в новой вкладке</strong><small>Сохранять Chrome Page открытым</small></span><input id="newtab-toggle" type="checkbox"></label>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="menu" class="popup hidden" role="menu">
    <button data-action="rename" role="menuitem">Переименовать</button>
    <button data-action="edit" role="menuitem">Изменить URL</button>
    <button data-action="move" role="menuitem">Переместить…</button>
    <button data-action="delete" role="menuitem" class="danger">Удалить</button>
  </div>

  <div id="dialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-message"></p>
      <label id="dialog-field" class="dialog-field hidden"><span id="dialog-label"></span><input id="dialog-input" type="text"></label>
      <div id="dialog-error" class="dialog-error hidden"></div>
      <div class="dialog-actions"><button id="dialog-cancel" type="button">Отмена</button><button id="dialog-submit" type="button">Сохранить</button></div>
    </div>
  </div>

  <div id="move-dialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="move-title">
    <div class="dialog move-dialog">
      <h2 id="move-title">Переместить</h2>
      <p id="move-item"></p>
      <input id="move-search" class="dialog-input" type="search" placeholder="Поиск папки…">
      <div id="move-list" class="move-list" role="listbox"></div>
      <div class="dialog-actions"><button id="move-cancel" type="button">Отмена</button><button id="move-submit" type="button" disabled>Переместить</button></div>
    </div>
  </div>

  <template id="bookmark-template">
    <article class="card bookmark-card"><a class="card-link" href=""><span class="favicon"></span><span class="card-text"><strong class="card-title"></strong></span></a><button class="more" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Действия"><svg class="icon" aria-hidden="true"><use href="#icon-more"></use></svg></button></article>
  </template>

  <template id="folder-template">
    <article class="card folder-card"><button class="card-link folder-link" type="button"><span class="favicon folder-icon"><svg class="icon" aria-hidden="true"><use href="#icon-folder"></use></svg></span><span class="card-text"><strong class="card-title"></strong><small class="card-meta"></small></span></button><button class="more" type="button" aria-label="Действия"><svg class="icon" aria-hidden="true"><use href="#icon-more"></use></svg></button></article>
  </template>

  <script type="module" src="src/app.js"></script>
</body>
</html>
