<!doctype html>
<html lang="ru" data-theme="system" data-blur="strong" data-ambient="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Chrome Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <div class="shell">
    <aside class="sidebar" aria-label="Навигация по закладкам">
      <header class="brand-row">
        <div class="brand"><span class="brand-mark">✦</span><span>Chrome Page</span></div>
        <span id="bookmark-total" class="badge" title="Всего закладок" aria-label="Всего закладок">0</span>
      </header>

      <label class="search search-sidebar">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Поиск закладок…" aria-label="Поиск закладок">
        <kbd id="search-kbd" class="search-kbd" aria-hidden="true">Ctrl K</kbd>
        <button id="search-clear" type="button" class="clear hidden" aria-label="Очистить поиск">×</button>
      </label>

      <div class="sidebar-label"><span>Места</span><span class="sidebar-label-line"></span></div>
      <nav id="folder-tree" class="folder-tree"></nav>

      <footer class="sidebar-footer">
        <button id="settings-button" type="button" class="icon-button" aria-label="Настройки" aria-pressed="false">⚙</button>
        <button id="theme-button" type="button" class="icon-button" aria-label="Переключить тему">◐</button>
      </footer>
    </aside>

    <main class="workspace">
      <header class="workspace-header">
        <div class="heading">
          <h1 id="folder-title">Загрузка…</h1>
          <nav id="breadcrumbs" class="breadcrumbs" aria-label="Путь"></nav>
        </div>

        <div class="header-actions">
          <div class="header-status" aria-live="polite"><span id="header-mode-dot"></span><span>Обновления включены</span></div>
          <button id="manager-button" type="button" class="ghost-button"><span aria-hidden="true">↗</span><span>Диспетчер</span></button>
        </div>
      </header>

      <section id="bookmark-panel" class="content-panel">
        <div id="bookmarks" class="bookmarks" data-view="grid" data-columns="auto" data-size="standard" data-spacing="standard" data-radius="round"></div>
      </section>

      <section id="settings-panel" class="settings-panel hidden" aria-label="Настройки">
        <div class="settings-card">
          <div class="settings-head"><div><span class="eyebrow">Chrome Page</span><h2>Настройки</h2><p>Настрой рабочее пространство под свой способ работы.</p></div></div>

          <div class="setting-section">
            <h3>Тема</h3>
            <div class="options" data-setting="theme">
              <button data-value="system">Система</button><button data-value="light">Светлая</button><button data-value="dark">Тёмная</button>
            </div>
          </div>

          <div class="setting-section">
            <h3>Сортировка</h3>
            <div class="options" data-setting="sortMode">
              <button data-value="default">Порядок Chrome</button><button data-value="name">По имени</button><button data-value="date">По дате</button>
            </div>
          </div>

          <div class="setting-grid">
            <div class="setting-section"><h3>Колонки</h3><div class="options" data-setting="columns"><button data-value="auto">Авто</button><button data-value="2">2</button><button data-value="3">3</button><button data-value="4">4</button></div></div>
            <div class="setting-section"><h3>Размер</h3><div class="options" data-setting="cardSize"><button data-value="compact">Малый</button><button data-value="standard">Средний</button><button data-value="large">Большой</button></div></div>
            <div class="setting-section"><h3>Отступы</h3><div class="options" data-setting="spacing"><button data-value="compact">Малые</button><button data-value="standard">Средние</button><button data-value="large">Большие</button></div></div>
            <div class="setting-section"><h3>Радиусы</h3><div class="options" data-setting="radius"><button data-value="sharp">Прямые</button><button data-value="soft">Мягкие</button><button data-value="round">Скруглённые</button></div></div>
            <div class="setting-section"><h3>Blur</h3><div class="options" data-setting="blur"><button data-value="soft">Мягкий</button><button data-value="strong">Сильный</button></div></div>
          </div>

          <div class="setting-section"><h3>Стекло</h3>
            <label class="toggle-row"><span><strong>Ambient-свечение</strong><small>Мягкие фоновые сферы под стеклом</small></span><input id="ambient-toggle" type="checkbox"></label>
            <label class="range-row"><span>Прозрачность поверхности</span><input id="opacity" type="range" min="55" max="100" step="5"><output id="opacity-value">78%</output></label>
            <label class="color-row"><span>Цвет фона</span><input id="background-color" type="color"><button id="reset-background" type="button">Сбросить</button></label>
          </div>

          <div class="setting-section"><h3>Поведение</h3>
            <label class="toggle-row"><span><strong>Открывать ссылки в новой вкладке</strong><small>Сохранять Chrome Page открытым</small></span><input id="newtab-toggle" type="checkbox"></label>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="menu" class="popup hidden" role="menu">
    <button data-action="rename" role="menuitem">Переименовать</button>
    <button data-action="edit" role="menuitem">Изменить URL</button>
    <button data-action="move" role="menuitem">Переместить…</button>
    <button data-action="delete" role="menuitem" class="danger">Удалить</button>
  </div>

  <div id="dialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-message"></p>
      <label id="dialog-field" class="dialog-field hidden"><span id="dialog-label"></span><input id="dialog-input" type="text"></label>
      <div id="dialog-error" class="dialog-error hidden"></div>
      <div class="dialog-actions"><button id="dialog-cancel" type="button">Отмена</button><button id="dialog-submit" type="button">Сохранить</button></div>
    </div>
  </div>

  <div id="move-dialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="move-title">
    <div class="dialog move-dialog">
      <h2 id="move-title">Переместить</h2>
      <p id="move-item"></p>
      <input id="move-search" class="dialog-input" type="search" placeholder="Поиск папки…">
      <div id="move-list" class="move-list" role="listbox"></div>
      <div class="dialog-actions"><button id="move-cancel" type="button">Отмена</button><button id="move-submit" type="button" disabled>Переместить</button></div>
    </div>
  </div>

  <template id="bookmark-template">
    <article class="card bookmark-card"><a class="card-link" href=""><span class="favicon"></span><span class="card-text"><strong class="card-title"></strong><small class="card-meta"></small></span></a><button class="more" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Действия">⋯</button></article>
  </template>

  <template id="folder-template">
    <article class="card folder-card"><button class="card-link folder-link" type="button"><span class="favicon folder-icon">▰</span><span class="card-text"><strong class="card-title"></strong><small class="card-meta"></small></span></button><button class="more" type="button" aria-label="Действия">⋯</button></article>
  </template>

  <script type="module" src="src/app.js"></script>
</body>
</html>
