<!doctype html>
<html lang="ru" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Chrome Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7v8.2a1.3 1.3 0 0 1-1.3 1.3h-4.7v-6h-5v6H4.8a1.3 1.3 0 0 1-1.3-1.3z"/></symbol>
    <symbol id="icon-bookmark" viewBox="0 0 24 24"><path d="M6.5 4.2A1.7 1.7 0 0 1 8.2 2.5h7.6a1.7 1.7 0 0 1 1.7 1.7v17.3L12 18.4l-5.5 3.1z"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 32 32">
      <path fill="#F7C948" d="M3.5 8.25A3.25 3.25 0 0 1 6.75 5h7.05l3.3 3.1H25.25A3.25 3.25 0 0 1 28.5 11.35v10.9a3.25 3.25 0 0 1-3.25 3.25H6.75A3.25 3.25 0 0 1 3.5 22.25z"/>
      <path fill="#FFD86B" d="M3.5 9.1A3.1 3.1 0 0 1 6.6 6h7.1l3.15 2.95h8.4c1.8 0 3.25 1.45 3.25 3.25v1.35H3.5z"/>
      <path fill="#E9A82F" d="M3.5 13.1h25v9.15a3.25 3.25 0 0 1-3.25 3.25H6.75a3.25 3.25 0 0 1-3.25-3.25z"/>
      <path fill="#F2B63F" d="M3.5 12.1h25v2.1H3.5z"/>
    </symbol>
    <symbol id="icon-folder-solid" viewBox="0 0 32 32">
      <path fill="#F7C948" d="M3.5 8.25A3.25 3.25 0 0 1 6.75 5h7.05l3.3 3.1H25.25A3.25 3.25 0 0 1 28.5 11.35v10.9a3.25 3.25 0 0 1-3.25 3.25H6.75A3.25 3.25 0 0 1 3.5 22.25z"/>
      <path fill="#FFD86B" d="M3.5 9.1A3.1 3.1 0 0 1 6.6 6h7.1l3.15 2.95h8.4c1.8 0 3.25 1.45 3.25 3.25v1.35H3.5z"/>
      <path fill="#E9A82F" d="M3.5 13.1h25v9.15a3.25 3.25 0 0 1-3.25 3.25H6.75a3.25 3.25 0 0 1-3.25-3.25z"/>
      <path fill="#F2B63F" d="M3.5 12.1h25v2.1H3.5z"/>
    </symbol>
    <symbol id="icon-mobile" viewBox="0 0 24 24"><rect x="7" y="3.5" width="10" height="17" rx="2"/><path d="M10 6.5h4M11 17.5h2"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="5.8"/><path d="m15.3 15.3 5 5"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.2 12a7.2 7.2 0 0 0-.1-1.2l2-1.5-1.8-3.2-2.3 1a7.4 7.4 0 0 0-2.1-1.2L14.5 3h-5l-.4 2.9A7.4 7.4 0 0 0 7 7.1l-2.3-1-1.8 3.2 2 1.5a7.2 7.2 0 0 0 0 2.4l-2 1.5 1.8 3.2 2.3-1a7.4 7.4 0 0 0 2.1 1.2l.4 2.9h5l.4-2.9a7.4 7.4 0 0 0 2.1-1.2l2.3 1 1.8-3.2-2-1.5c.1-.4.1-.8.1-1.2Z"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 5h5v5M10 14l9-9M19 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4"/></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></symbol>
    <symbol id="icon-clear" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m4 16.5-.8 3.8 3.8-.8L18.4 8.1a2.8 2.8 0 0 0-4-4z"/><path d="m13.5 5.5 5 5"/></symbol>
    <symbol id="icon-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2a5 5 0 0 0 7.1 7.1l1.1-1.1"/></symbol>
    <symbol id="icon-move" viewBox="0 0 24 24"><path d="M7 5v4M7 9H4l3 3M17 19v-4M17 15h3l-3-3M7 9h8a4 4 0 0 1 4 4v2M17 15H9a4 4 0 0 1-4-4V9"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13M10 11v6m4-6v6"/></symbol>
  </svg>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <div class="shell">
    <aside class="sidebar" aria-label="Навигация по закладкам">
      <label class="search search-sidebar">
        <svg class="icon search-icon" aria-hidden="true"><use href="#icon-search"></use></svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Поиск закладок…" aria-label="Поиск закладок">
        <kbd id="search-kbd" class="search-kbd" aria-hidden="true">Ctrl K</kbd>
        <button id="search-clear" type="button" class="clear hidden" aria-label="Очистить поиск"><svg class="icon" aria-hidden="true"><use href="#icon-clear"></use></svg></button>
      </label>

      <nav id="folder-tree" class="folder-tree"></nav>

      <footer class="sidebar-footer">
        <button id="settings-button" type="button" class="icon-button" aria-label="Настройки" aria-pressed="false" title="Настройки"><svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg></button>
        <button id="manager-button" type="button" class="icon-button" aria-label="Диспетчер" title="Диспетчер"><svg class="icon" aria-hidden="true"><use href="#icon-external"></use></svg></button>
      </footer>
    </aside>

    <main class="workspace">
      <header class="workspace-header">
        <div class="heading">
          <h1 id="folder-title">Загрузка…</h1>
          <nav id="breadcrumbs" class="breadcrumbs" aria-label="Путь"></nav>
        </div>


      </header>

      <section id="bookmark-panel" class="content-panel">
        <div id="bookmarks" class="bookmarks" data-columns="auto" data-size="standard" data-spacing="standard" ></div>
      </section>

      <section id="settings-panel" class="settings-panel hidden" aria-label="Настройки">
        <div class="settings-card">
          <div class="settings-head">
            <div>
              <span class="eyebrow">Chrome Page</span>
              <h2>Настройки</h2>
              <p>Настрой рабочее пространство под свой способ работы.</p>
            </div>
          </div>

          <div class="setting-section">
            <h3>Внешний вид</h3>
            <div class="setting-group">
              <div class="setting-item">
                <span class="setting-label">Тема</span>
                <div class="options" data-setting="theme">
                  <button data-value="system" aria-pressed="false">Система</button>
                  <button data-value="light" aria-pressed="false">Светлая</button>
                  <button data-value="dark" aria-pressed="false">Тёмная</button>
                </div>
              </div>
              <div class="setting-item">
                <span class="setting-label">Сортировка</span>
                <div class="options" data-setting="sortMode">
                  <button data-value="default" aria-pressed="false">Порядок Chrome</button>
                  <button data-value="name" aria-pressed="false">По имени</button>
                  <button data-value="date" aria-pressed="false">По дате добавления</button>
                </div>
              </div>
              <div class="setting-item">
                <span class="setting-label">Колонки</span>
                <div class="options" data-setting="columns">
                  <button data-value="auto" aria-pressed="false">Авто</button>
                  <button data-value="2" aria-pressed="false">2</button>
                  <button data-value="3" aria-pressed="false">3</button>
                  <button data-value="4" aria-pressed="false">4</button>
                </div>
              </div>
              <div class="setting-item">
                <span class="setting-label">Размер</span>
                <div class="options" data-setting="cardSize">
                  <button data-value="compact" aria-pressed="false">Компактный</button>
                  <button data-value="standard" aria-pressed="false">Обычный</button>
                  <button data-value="large" aria-pressed="false">Большой</button>
                </div>
              </div>
              <div class="setting-item">
                <span class="setting-label">Отступы</span>
                <div class="options" data-setting="spacing">
                  <button data-value="compact" aria-pressed="false">Малые</button>
                  <button data-value="standard" aria-pressed="false">Средние</button>
                  <button data-value="large" aria-pressed="false">Большие</button>
                </div>
              </div>
            </div>
          </div>

          <div class="setting-section">
            <h3>Поведение</h3>
            <label class="toggle-row">
              <span>
                <strong>Открывать ссылки в новой вкладке</strong>
                <small>Сохранять Chrome Page открытым</small>
              </span>
              <input id="newtab-toggle" type="checkbox">
            </label>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="menu" class="popup hidden" role="menu">
    <button data-action="rename" role="menuitem"><svg class="icon" aria-hidden="true"><use href="#icon-edit"></use></svg><span>Переименовать</span></button>
    <button data-action="edit" role="menuitem"><svg class="icon" aria-hidden="true"><use href="#icon-link"></use></svg><span>Изменить URL</span></button>
    <button data-action="move" role="menuitem"><svg class="icon" aria-hidden="true"><use href="#icon-move"></use></svg><span>Переместить…</span></button>
    <button data-action="delete" role="menuitem" class="danger"><svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg><span>Удалить</span></button>
  </div>

  <div id="dialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-message">
    <div class="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-message"></p>
      <label id="dialog-field" class="dialog-field hidden"><span id="dialog-label"></span><input id="dialog-input" type="text"></label>
      <div id="dialog-error" class="dialog-error hidden"></div>
      <div class="dialog-actions"><button id="dialog-cancel" type="button">Отмена</button><button id="dialog-submit" type="button">Сохранить</button></div>
    </div>
  </div>

  <div id="move-dialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="move-title" aria-describedby="move-item">
    <div class="dialog move-dialog">
      <h2 id="move-title">Переместить</h2>
      <p id="move-item"></p>
      <input id="move-search" class="dialog-input" type="search" aria-label="Поиск папки" placeholder="Поиск папки…">
      <div id="move-list" class="move-list" role="listbox"></div>
      <div class="dialog-actions"><button id="move-cancel" type="button">Отмена</button><button id="move-submit" type="button" disabled>Переместить</button></div>
    </div>
  </div>

  <template id="bookmark-template">
    <article class="card bookmark-card"><a class="card-link" href=""><span class="favicon"></span><span class="card-text"><strong class="card-title"></strong></span></a><button class="more" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Действия"><svg class="icon" aria-hidden="true"><use href="#icon-more"></use></svg></button></article>
  </template>

  <template id="folder-template">
    <article class="card folder-card"><button class="card-link folder-link" type="button"><span class="favicon folder-icon"><svg class="icon" aria-hidden="true"><use href="#icon-folder-solid"></use></svg></span><span class="card-text"><strong class="card-title"></strong></span></button><button class="more" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Действия папки"><svg class="icon" aria-hidden="true"><use href="#icon-more"></use></svg></button></article>
  </template>

  <script type="module" src="src/app.js"></script>
</body>
</html>
